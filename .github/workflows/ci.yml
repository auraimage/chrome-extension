name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify-dist
      - run: pnpm run pack

      # puppeteer's Chrome download is a postinstall that pnpm 10 blocks by
      # default, so fetch the browser explicitly before the smoke test loads it.
      - run: pnpm exec puppeteer browsers install chrome

      - run: pnpm test:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: auraimage-x-ray
          path: auraimage-x-ray-v*.zip
          if-no-files-found: error

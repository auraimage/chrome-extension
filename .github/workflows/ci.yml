name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm zip

      # WXT generates the manifest and owns bundling, so the old dist-integrity
      # check is gone; the e2e loads the built extension in real Chrome instead.
      # Extensions load headless only via the `chromium` channel.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: auraimage-x-ray
          path: .output/*-chrome.zip
          if-no-files-found: error

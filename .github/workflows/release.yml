# .github/workflows/release.yml
#
# Tag-driven release for the AuraImage X-Ray extension. Runs on a `v*` tag
# (or a manual re-run via workflow_dispatch pointed at a tag ref), enforces
# that the tag equals `v{package.json .version}` (the single version source
# under WXT), runs the full CI gauntlet, publishes a GitHub Release with the
# `wxt zip` archive, then submits to the Chrome Web Store via `wxt submit`.
#
# Chrome Web Store submission is optional: the submit step is skipped (with a
# run-summary notice) unless the required repo secrets are configured. The
# GitHub Release is always created.
#
# Required repository secrets for Chrome Web Store submission (read by
# `wxt submit`, the publish-browser-extension package):
#   CHROME_EXTENSION_ID    The extension's item ID (from its store URL / dashboard)
#   CHROME_CLIENT_ID       Google Cloud OAuth 2.0 client ID (Chrome Web Store API)
#   CHROME_CLIENT_SECRET   OAuth 2.0 client secret
#   CHROME_REFRESH_TOKEN   OAuth refresh token minted for the chromewebstore scope

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release in flight; run them one at a time.
concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Map the Chrome Web Store secrets into job-level env so the submit step can
    # gate on their presence: `secrets.*` is not usable in a step `if:`, but
    # job-level `env.*` is.
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate tag matches package.json version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::release must run on a tag ref (refs/tags/v*), got '$GITHUB_REF'. For a workflow_dispatch re-run, select a vX.Y.Z tag as the ref."
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::tag '$TAG' does not match package.json version (expected '$EXPECTED'). Bump package.json .version to match the tag, or retag."
            exit 1
          fi
          echo "tag '$TAG' matches package.json version"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm zip

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; re-uploading the zip"
            gh release upload "$TAG" .output/*-chrome.zip --clobber
          else
            gh release create "$TAG" .output/*-chrome.zip --title "$TAG" --generate-notes
          fi

      - name: Submit to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip

      - name: Note Chrome Web Store submission skipped
        if: env.CHROME_EXTENSION_ID == ''
        run: echo "::notice::Chrome Web Store secrets not configured; skipping store submission (GitHub Release still created)"

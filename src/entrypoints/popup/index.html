<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuraImage X-Ray</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: oklch(0.985 0.003 260);
        --card: oklch(0.985 0.003 260);
        --fg: oklch(0.12 0.005 260);
        --muted-fg: oklch(0.45 0.005 260);
        --muted: oklch(0.97 0.003 260);
        --border: oklch(0.91 0.003 260);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.14 0.005 260);
          --card: oklch(0.17 0.005 260);
          --fg: oklch(0.95 0.003 260);
          --muted-fg: oklch(0.65 0.005 260);
          --muted: oklch(0.22 0.005 260);
          --border: oklch(0.28 0.005 260);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, 'Onest', 'Inter', -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--muted-fg);
      }
      .name {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        word-break: break-all;
      }
      .hint {
        margin: 12px 0 0;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--muted-fg);
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 16px 0 0;
      }
      .stat dt {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        color: var(--muted-fg);
      }
      .stat dd {
        margin: 2px 0 0;
        font-size: 1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .lcp {
        margin: 12px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        color: var(--muted-fg);
        word-break: break-all;
      }
      .flags {
        list-style: none;
        margin: 16px 0 0;
        padding: 12px 0 0;
        border-top: 1px solid var(--border);
      }
      .flags li {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        line-height: 1.9;
        color: var(--fg);
      }
      .flags li span:first-child {
        color: var(--muted-fg);
      }
      .cdn {
        margin: 14px 0 0;
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--fg);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 12px 0 0;
      }
      .actions button {
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 9999px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (prefers-reduced-motion: no-preference) {
        .actions button {
          transition: background 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
      }
      .actions button:hover {
        background: var(--muted);
      }
      .actions .wide {
        grid-column: 1 / -1;
      }
      .actions a.gate {
        display: block;
        grid-column: 1 / -1;
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        text-align: center;
        text-decoration: none;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 9999px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        margin: 14px 2px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        color: var(--muted-fg);
      }
      .footer a {
        color: var(--muted-fg);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <div class="footer">
      <span>measured, not scored</span>
      <a href="https://auraimage.ai" target="_blank" rel="noreferrer">auraimage.ai</a>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
